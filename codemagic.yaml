workflows:
  ios-release:
    name: iOS Release Build
    instance_type: mac_mini_m1
    max_build_duration: 30
    environment:
      flutter: stable
      xcode: latest
    scripts:
      - name: Get Flutter packages and create iOS files
        script: |
          flutter pub get
          flutter create . --platforms=ios
      - name: Build iOS App (.app)
        script: |
          flutter build ios --release --no-codesign
      - name: Create runner.app payload and zip
        script: |
          cd build/ios/iphoneos
          mkdir Payload
          mv Runner.app Payload/
          zip -r KTrade.ipa Payload
    artifacts:
      - build/ios/iphoneos/*.ipa