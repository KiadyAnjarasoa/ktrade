name: ktrade
description: "KTrade - Journal de trading et assistant de prise de position"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter

  # State Management & UI Utilities
  provider: ^6.1.2
  intl: ^0.19.0
  cupertino_icons: ^1.0.8

  # Base de données locale SQLite & Storage
  sqflite: ^2.3.3+1
  path: ^1.9.0
  path_provider: ^2.1.4

  # Importation MT5 & Fichiers CSV
  csv: ^6.0.0

  # file_picker: ^8.3.7

  # Graphiques de Performance
  fl_chart: ^0.69.0

  # Images (Captures d'écran des trades)
  image_picker: ^1.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  # Dossier pour les captures/assets si besoin
  assets:
    - assets/